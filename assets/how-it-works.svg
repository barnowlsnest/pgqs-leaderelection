<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430" role="img" aria-label="Animated diagram: three processes campaign for a lease in PostgreSQL; A leads and renews, crashes, its lease expires and B takes over.">
<style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#656d76;--line:#d0d7de;--panel:#f6f8fa;--accent:#0969da;
--ok:#1a7f37;--err:#cf222e;--a:#8250df;--b:#bf8700;--c:#0550ae;--dead:#eaeef2}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#e6edf3;--muted:#8d96a0;--line:#30363d;
--panel:#161b22;--accent:#4493f8;--ok:#3fb950;--err:#f85149;--a:#a371f7;--b:#d29922;--c:#58a6ff;--dead:#21262d}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--fg);font-size:14px}
.bg{fill:var(--bg);stroke:var(--line)}
.title{font-size:15px;font-weight:600}
.wire{stroke:var(--line);stroke-width:1.5;stroke-dasharray:4 5}
.node{fill:var(--panel);stroke:var(--line);stroke-width:1.5}
.node-lead{fill:none;stroke:var(--ok);stroke-width:2.5}
.node-dead{fill:var(--dead);stroke:var(--line);stroke-width:1.5}
.node-t{font-weight:600;font-size:15px}
.badge{fill:var(--ok)}
.badge-t{fill:#fff;font-size:11px;font-weight:700;text-anchor:middle;letter-spacing:.5px}
.dead-t{fill:var(--err);font-size:12px;font-weight:600;text-anchor:end}
.st{fill:var(--muted);font-size:12.5px}
.st-ok{fill:var(--ok);font-size:12.5px;font-weight:600}
.st-err{fill:var(--err);font-size:12.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.pg{fill:none;stroke:var(--accent);stroke-width:1.5}
.pg-t{fill:var(--accent);font-weight:600}
.panel{fill:var(--panel);stroke:var(--line)}
.panel-hot{fill:none;stroke:var(--accent);stroke-width:2.5}
.panel-t{font-weight:600}
.lock{stroke:var(--muted);stroke-width:2.5}
.lock-body{fill:var(--muted)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.muted{fill:var(--muted)}
.small{font-size:11.5px!important}
.hot-t{fill:var(--accent);font-weight:600;font-size:13px}
.rule{stroke:var(--line)}
.label{fill:var(--muted);font-size:13px}
.val{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:600;font-size:15px}
.ok-t{fill:var(--ok);font-weight:600;font-size:13px}
.err-t{fill:var(--err);font-weight:600;font-size:13px}
.track{fill:var(--line)}
.bar{fill:var(--accent)}
.pa{fill:var(--a)}.pb{fill:var(--b)}.pc{fill:var(--c)}
.rok{fill:var(--ok)}.rno{fill:var(--err)}
.cap{font-size:14.5px}
