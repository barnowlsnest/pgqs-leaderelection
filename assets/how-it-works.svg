<text class="cap" x="410" y="400" text-anchor="middle" style="opacity:0;animation:k45 18.0s linear infinite">A locks the key, finds no lease, writes holder=A, unlocks</text>
<text class="cap" x="410" y="400" text-anchor="middle" style="opacity:0;animation:k46 18.0s linear infinite">B locks the key, finds a valid lease, unlocks → ErrLeaseHeldByOther</text>
<text class="cap" x="410" y="400" text-anchor="middle" style="opacity:0;animation:k47 18.0s linear infinite">Leader A renews: expires_at pushed out, version bumped</text>
<text class="cap" x="410" y="400" text-anchor="middle" style="opacity:0;animation:k48 18.0s linear infinite">C gets the same answer — the lock serializes every decision</text>
<text class="cap" x="410" y="400" text-anchor="middle" style="opacity:0;animation:k49 18.0s linear infinite">A crashes. Nobody renews, so the lease runs out on its own</text>
<text class="cap" x="410" y="400" text-anchor="middle" style="opacity:0;animation:k50 18.0s linear infinite">Lease expired → B's next attempt takes over (version 3)</text>
<text class="cap" x="410" y="400" text-anchor="middle" style="opacity:0;animation:k51 18.0s linear infinite">B leads. The lock is held per operation, never for the whole term</text>
</svg>
