name: 'lint.yml'
run-name: 'Lint'

on:
  pull_request:
  push:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # v2.14.0 bundles x/tools v0.50.0, which reads Go 1.27.2 export data (pkgbits V5).
          version: v2.14.0
